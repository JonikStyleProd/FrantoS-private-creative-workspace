<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import { createFormScene } from '/src/frantos2/form/formScene.ts';
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 1600, H = +q.get('h') || 2000;
const c = document.getElementById('c'); c.style.width = W + 'px'; c.style.height = H + 'px';
const s = createFormScene({ canvas: c, look: q.get('look') || 'v2', background: q.get('bg') || '#E8E2D6', pixelRatio: 1, preserveDrawingBuffer: true, transparent: q.get('alpha') === '1', segments: +q.get('seg') || 260 });
s.setSize(W, H);
window.renderAt = (rot) => { s.render(rot, 0); return c.toDataURL('image/png'); };
window.ready = true;
</script></body></html>
