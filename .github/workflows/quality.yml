# Every push and pull request: type check, end-to-end and visual tests in three languages,
# and a Lighthouse performance budget for phones. All free on GitHub Actions.
name: quality
on:
  push:
    branches: [main, frantos-2.0]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npx playwright install --with-deps chromium
      - name: End-to-end and visual tests
        run: npx playwright test --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: VITE_AUTH_GATE=off npm run build
      - name: Lighthouse budget (mobile)
        run: npx -y @lhci/cli@0.14 autorun
